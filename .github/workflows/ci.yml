name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        laravel: ['10.*', '11.*', '12.*']
        # Testbench major is tied to the Laravel major.
        include:
          - laravel: '10.*'
            testbench: '^8.0'
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'
        exclude:
          # Laravel 11 requires PHP 8.2+
          - php: '8.1'
            laravel: '11.*'
          # Laravel 12 requires PHP 8.2+
          - php: '8.1'
            laravel: '12.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, intl
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}

      - name: Install deps
        run: |
          # Laravel 10 is EOL: every 10.x release has a security advisory and
          # Composer >= 2.9 refuses to install it. Still supported by the
          # package, so allow it in CI only.
          if [ "${{ matrix.laravel }}" = "10.*" ]; then
            composer config audit.block-insecure false
          fi
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress -W

      - name: Run tests
        run: vendor/bin/phpunit --colors=always
        env:
          PROCESSHUB_TEST_REDIS_HOST: 127.0.0.1

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install deps
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github
